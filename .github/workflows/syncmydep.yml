name: Dependency Sync Check

on:
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'
      - 'bun.lock'
      - 'bun.lockb'
  pull_request:
    paths:
      - 'package.json'
  workflow_dispatch:

jobs:
  verify-sync:
    name: Run SyncMyDep
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run SyncMyDep Action
        uses: nivinvysakh/syncmydep@Beta
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
