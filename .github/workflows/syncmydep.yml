name: Sync Dependencies & Fix Vulnerabilities

on:
  schedule:
    - cron: "0 8 * * 1" # Runs weekly every Monday at 08:00 UTC
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab
  push:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - "bun.lock"
      - "deno.json"
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync-dependencies:
    name: Sync Dependencies & Open PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SyncMyDep
        uses: nivinvysakh/syncmydep@Beta
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Optional settings (can also be configured in .syncmydep.yml):
          # verify-lockfile: "true"
          # run-build: "npm run build"
          # auto-merge: "true"
