name: Sync Dependencies & Fix Vulnerabilities

on:
  schedule:
    # Run weekly on Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch: # Allows manual one-click trigger
  push:
    paths:
      - "package.json"
      - ".syncmydep.yml"
      - "pnpm-workspace.yaml"
      - "bun.lock"
      - "deno.json"
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync-dependencies:
    name: Sync Dependencies & Open PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Run SyncMyDep
        uses: nivinvysakh/syncmydep@Beta
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          update-readme-badge: "true" # 👈 Enable dynamic README status badge updates
          generate-report: "true"     # 👈 Generates interactive HTML dashboard
          report-path: "syncmydep-report.html"

      # 📊 Upload the interactive HTML report as a workflow artifact
      - name: Upload Interactive HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syncmydep-report
          path: syncmydep-report.html
          if-no-files-found: ignore
